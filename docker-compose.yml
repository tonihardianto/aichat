services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chat}
      MYSQL_USER: ${MYSQL_USER:-chatuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chatpassword}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      MYSQL_DSN: "${MYSQL_DSN:-chatuser:chatpassword@tcp(db:3306)/chat?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci}"
      STORAGE_PATH: /app/data/attachments
      LLM_BASE_URL: "${LLM_BASE_URL:-http://host.docker.internal:11434/v1}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      SESSION_SECRET: "${SESSION_SECRET}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - attachment_data:/app/data/attachments
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mysql_data:
  attachment_data:
